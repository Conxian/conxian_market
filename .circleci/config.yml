version: 2.1

# Conxian Market — CircleCI
# Fee calculator (CON-1427), TypeScript validation, secret scan.

executors:
  node:
    docker:
      - image: cimg/node:22.14
    resource_class: medium

jobs:
  test:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run fee calculator tests
          command: npx vitest run
          no_output_timeout: 5m

  typecheck:
    executor: node
    steps:
      - checkout
      - run:
          name: TypeScript check
          command: npx tsc --noEmit

  secret-scan:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Gitleaks scan
          command: |
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_amd64.tar.gz | tar xz
            ./gitleaks detect --config gitleaks.toml --verbose

workflows:
  version: 2
  main:
    jobs:
      - test
      - typecheck
      - secret-scan