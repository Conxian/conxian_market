version: 2.1

jobs:
  validate-repo:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Verify ZSE & Tracking Hygiene"
          command: |
            echo "Checking ZSE compliance..."
            PROHIBITED=$(git ls-files | grep -i -E "\.env$|\.key$|\.pem$|credentials\.json|secrets\.json" || true)
            if [ -n "$PROHIBITED" ]; then
              echo "Prohibited secret files found in git index: $PROHIBITED"
              exit 1
            fi
            echo "Checking artifact hygiene..."
            ARTIFACTS=$(git ls-files | grep -i -E "^node_modules/|^dist/|^build/|^coverage/|^playwright-report/|test\.txt$" || true)
            if [ -n "$ARTIFACTS" ]; then
              echo "Tracked artifact files found: $ARTIFACTS"
              exit 1
            fi
            echo "Checking documentation files..."
            for doc in README.md SECURITY.md CONTRIBUTING.md LICENSE ROADMAP.md CHANGELOG.md; do
              if [ ! -f "$doc" ]; then
                echo "Missing required doc: $doc"
                exit 1
              fi
            done
            echo "CircleCI repository validation passed."

workflows:
  validation-workflow:
    jobs:
      - validate-repo
